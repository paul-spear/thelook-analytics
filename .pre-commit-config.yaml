repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]   # dbt YAML uses jinja
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.5
    hooks:
      - id: sqlfluff-lint
        files: ^(models|snapshots|macros|tests|analyses)/.*\.sql$

  # Enable once models exist and `dbt parse` works locally (needs target/manifest.json).

name: thelook_analytics
version: "0.1.0"
config-version: 2
require-dbt-version: ">=1.10.0"
profile: thelook_analytics

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

models:
  thelook_analytics:
    +persist_docs: {relation: true, columns: true}
    staging:
      +materialized: view
      +schema: staging
      +meta: {layer: landing}
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +meta: {layer: logical}
    marts:
      +materialized: table
      +schema: marts
      +meta: {layer: logical}
    utilities:
      +materialized: table
      +schema: utilities

snapshots:
  thelook_analytics:
    +target_schema: snapshots
    +meta: {layer: normalised}

query-comment:
  job-label: true   # copy the query comment into BigQuery job labels for cost attribution
